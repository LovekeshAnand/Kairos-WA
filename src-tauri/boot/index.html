<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Kairos</title>
  <style>
    html, body { margin: 0; height: 100%; background: #fff; color: #1b1712; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { display: grid; place-items: center; }
    .box { text-align: center; max-width: 420px; padding: 24px; }
    .spin { width: 34px; height: 34px; margin: 0 auto 18px; border-radius: 50%; border: 3px solid #f5efe7; border-top-color: #f28a3c; animation: s .8s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
    b { display: block; font-size: 17px; margin-bottom: 6px; }
    p { color: #5d554b; line-height: 1.5; margin: 0; font-size: 14px; }
    .err .spin { display: none; }
    .err b { color: #d4513b; }
    code { background: #f5efe7; padding: 1px 6px; border-radius: 6px; font-size: 12px; word-break: break-all; }
  </style>
</head>
<body>
  <div class="box" id="box">
    <div class="spin"></div>
    <b id="title">Starting Kairos…</b>
    <p id="msg">Waking the background service. This takes a few seconds.</p>
  </div>
  <script>
    // The shell calls this while it prepares the engine.
    window.kairosBoot = (title, msg, error) => {
      document.getElementById('title').textContent = title;
      document.getElementById('msg').innerHTML = msg;
      document.getElementById('box').className = 'box' + (error ? ' err' : '');
    };
  </script>
</body>
</html>
